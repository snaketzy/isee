name: isee
description: 流媒体视频订阅平台 (Netflix-style Streaming Platform)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # 路由
  go_router: ^14.6.2

  # 视频播放
  video_player: ^2.9.1
  media_kit: ^1.1.10+1
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4

  # 网络与图片
  dio: ^5.7.0
  cached_network_image: ^3.4.1

  # 工具
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.3
  collection: ^1.18.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.13
  go_router_builder: ^2.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
